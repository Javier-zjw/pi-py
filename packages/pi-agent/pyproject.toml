[project]
name = "pi-agent"
version = "0.1.0"
description = "Molecular layer: agent runtime with tool calling and state management"
requires-python = ">=3.10"
dependencies = ["pi-ai>=0.1.0"]   # only ever the layer directly below

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_agent"]
