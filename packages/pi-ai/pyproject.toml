[project]
name = "pi-ai"
version = "0.1.0"
description = "Atomic layer: unified multi-provider LLM API"
requires-python = ">=3.10"
dependencies = []            # deliberately empty: no pi-* dependency, ever

[project.optional-dependencies]
http = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_ai"]
