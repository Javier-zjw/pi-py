[project]
name = "pi-coding-agent"
version = "0.1.0"
description = "Compound layer: coding tools, sessions, skills, extensions, CLI"
requires-python = ">=3.10"
dependencies = ["pi-agent>=0.1.0", "pi-ai>=0.1.0", "httpx>=0.27"]

[project.scripts]
pi = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_coding_agent"]
