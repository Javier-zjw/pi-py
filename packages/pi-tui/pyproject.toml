[project]
name = "pi-tui"
version = "0.1.0"
description = "Terminal rendering primitives. Zero dependencies, knows nothing about agents."
requires-python = ">=3.10"
dependencies = []          # 和 pi-ai 一样：永远为空

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_tui"]
[project.optional-dependencies]
input = ["prompt_toolkit>=3.0"]
